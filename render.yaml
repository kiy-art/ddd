databases:
  - name: golf-deals-db
    plan: free
    databaseName: golf_deals
    user: golf_deals

services:
  - type: web
    name: golf-deals-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/init_db.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: golf-deals-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      # sync: false - set manually in the Render dashboard, not by this
      # blueprint. Custom-domain migration (par-gear.com): must include
      # https://par-gear.com (comma-separated with any other allowed
      # origins) or the frontend's API calls from the new domain will be
      # rejected by CORS.
      - key: CORS_ORIGINS
        sync: false
      - key: RAKUTEN_APP_ID
        sync: false
      - key: RAKUTEN_ACCESS_KEY
        sync: false
      - key: RAKUTEN_AFFILIATE_ID
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_AFFILIATE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "PAR. <onboarding@resend.dev>"
      - key: SITE_URL
        value: https://par-gear.com
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false

  - type: web
    name: golf-deals-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      # sync: false - set manually in the Render dashboard, not by this
      # blueprint. NEXT_PUBLIC_* vars are baked in at Next.js BUILD time,
      # so changing one requires a rebuild (a new deploy), not just a
      # restart, before it takes effect.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Custom-domain migration (par-gear.com): update this to
      # https://par-gear.com once the domain is added to this service in
      # the Render dashboard and its DNS has propagated - this value
      # feeds sitemap.xml/robots.txt/canonical URLs/OGP metadata (see
      # app/sitemap.ts, app/robots.ts, app/layout.tsx).
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_AMAZON_AFFILIATE_TAG
        sync: false
