databases:
  - name: golf-deals-db
    plan: free
    databaseName: golf_deals
    user: golf_deals

services:
  - type: web
    name: golf-deals-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/init_db.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: golf-deals-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      # sync: false - set manually in the Render dashboard, not by this
      # blueprint. Custom-domain migration (par-gear.com): must include
      # https://par-gear.com (comma-separated with any other allowed
      # origins) or the frontend's API calls from the new domain will be
      # rejected by CORS.
      - key: CORS_ORIGINS
        sync: false
      - key: RAKUTEN_APP_ID
        sync: false
      - key: RAKUTEN_ACCESS_KEY
        sync: false
      - key: RAKUTEN_AFFILIATE_ID
        sync: false
      # STEP52: optional owner-entered sale periods for the consumables
      # corner (JSON list - see backend/.env.example). Empty = no event.
      - key: CONSUMABLE_SALE_EVENTS
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_AFFILIATE_ID
        sync: false
      # GA4 Data API + Search Console API (see README section 6) - power
      # /admin/analytics and the STEP42 autonomous content-optimization
      # daily job. Both optional; a no-op until set.
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SEARCH_CONSOLE_SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "PAR. <onboarding@resend.dev>"
      # Recipient for the daily "AI会議" report email (app/daily_report.py).
      # A personal address, so - unlike RESEND_FROM_EMAIL above - it's never
      # a committed value; set the real address in the Render dashboard.
      - key: DAILY_REPORT_EMAIL
        sync: false
      - key: SITE_URL
        value: https://par-gear.com
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false

  - type: web
    name: golf-deals-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    # Render's Blueprint field for this is `domains` (not `customDomains`
    # - verified against Render's own docs/render-domains reference, since
    # an incorrect key here would be silently ignored by Render's
    # blueprint parser rather than erroring). This only DECLARES the
    # association on Render's side; it does not configure DNS. The domain
    # must also be added under this service in the Render dashboard (or
    # confirmed there once the blueprint syncs) and its DNS records (a
    # CNAME/ALIAS per Render's own instructions once the domain is added)
    # set with the registrar before it actually resolves - see
    # docs/ai_company_guidelines.md 3.5.15 for the full remaining
    # checklist (env vars, DNS, redeploy).
    domains:
      - par-gear.com
      - www.par-gear.com
    envVars:
      # sync: false - set manually in the Render dashboard, not by this
      # blueprint. NEXT_PUBLIC_* vars are baked in at Next.js BUILD time,
      # so changing one requires a rebuild (a new deploy), not just a
      # restart, before it takes effect.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Custom-domain migration (par-gear.com): update this to
      # https://par-gear.com once the domain is added to this service in
      # the Render dashboard and its DNS has propagated - this value
      # feeds sitemap.xml/robots.txt/canonical URLs/OGP metadata (see
      # app/sitemap.ts, app/robots.ts, app/layout.tsx).
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # GA4導入（別タスク）: 値はGoogle Analyticsの測定ID（例:
      # G-XXXXXXXXXX）。未設定の間はGAスクリプト自体が読み込まれず
      # 何も収集されない（lib/analytics.ts参照）。sync: falseのため
      # 実際の値はRenderダッシュボードで設定する。
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: NEXT_PUBLIC_AMAZON_AFFILIATE_TAG
        sync: false
