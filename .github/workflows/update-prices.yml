name: Daily price update

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch: {}

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger price update on the live backend
        run: |
          curl -sS --fail-with-body --max-time 180 -X POST \
            "https://golf-deals-backend.onrender.com/api/admin/fetch-rakuten" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}"
