name: Daily price update

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch: {}

jobs:
  update-prices:
    runs-on: ubuntu-latest
    # The job itself runs server-side in the background (STEP66); this
    # workflow only starts it and then polls. Sized for a slow day's run
    # (~45 min) plus the wake-up, with headroom.
    timeout-minutes: 75
    env:
      BACKEND: https://golf-deals-backend.onrender.com
    steps:
      # Render's free plan spins a web service down after 15 minutes of no
      # traffic; the first request of the day always pays that cold-start
      # cost (up to ~1 minute). Waking it up here, separately from the real
      # job, keeps that cost out of the start step's own timeout. Failure
      # here is never fatal - the next step will wake it anyway.
      - name: Wake up the backend (Render free tier sleeps when idle)
        continue-on-error: true
        run: curl -sS --max-time 90 "$BACKEND/api/health" || true

      # STEP66: the daily pipeline (Rakuten + Yahoo price fetch, discovery,
      # popularity sync, analysis, alerts, X post, report) grew past 15
      # minutes, and running it inside one request made curl give up (exit
      # 28) - after which its retry started a second full run on top of the
      # first. Now ?background=true returns at once (202) and the job runs
      # in a server thread. A 409 means a run is already in progress (e.g. a
      # retry after a dropped response, or the admin button) - that one is
      # followed instead of starting another.
      - name: Start the daily price update job
        run: |
          code=$(curl -sS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -o start.json -w '%{http_code}' \
            -X POST "$BACKEND/api/admin/fetch-rakuten?background=true" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}")
          cat start.json; echo
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "::error::Could not start the daily job (HTTP $code)"
            exit 1
          fi

      # Polling every 30s also keeps the free-tier instance awake while the
      # job runs. A failed poll (network blip) is just retried next round.
      # "idle" means the server restarted mid-run and lost the run.
      - name: Wait for the job to finish
        run: |
          for i in $(seq 1 130); do
            sleep 30
            if ! curl -sS --max-time 30 -o status.json \
                "$BACKEND/api/admin/daily-job/status" \
                -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}"; then
              echo "poll $i: no response, retrying"
              continue
            fi
            status=$(jq -r '.status // "unknown"' status.json 2>/dev/null || echo unknown)
            echo "poll $i: $status"
            case "$status" in
              completed) jq '.result' status.json > response.json; cat response.json; exit 0 ;;
              failed) jq . status.json > response.json; echo "::error::The daily job failed: $(jq -r '.error' status.json)"; exit 1 ;;
              idle) echo "::error::The backend restarted during the job and lost it (see the admin error log)"; exit 1 ;;
            esac
          done
          echo "::error::The daily job did not finish within the wait window"
          exit 1

      # Runs even when a step above failed, so a failed run still shows
      # whatever was captured instead of forcing a dig through raw logs.
      # GitHub also emails the repo owner automatically when a scheduled
      # workflow run fails - no extra notification wiring needed here.
      - name: Summarize result
        if: always()
        run: |
          {
            echo '### Daily price update result'
            echo '```json'
            cat response.json 2>/dev/null || cat status.json 2>/dev/null || echo '(no result captured - see the steps above)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
